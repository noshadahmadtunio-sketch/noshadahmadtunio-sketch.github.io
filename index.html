<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noshad Ali | Computer Science Student</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7FC;--surface:#fff;--ink:#12203F;--muted:#54607A;--accent:#2B55E6;--on-accent:#fff;--warm:#F2B134;--line:#D8E0EE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1424;--surface:#161E33;--ink:#EAF0FF;--muted:#9AA7C4;--accent:#7C9BFF;--on-accent:#0E1424;--line:#27324D}}
:root[data-theme="dark"]{--bg:#0E1424;--surface:#161E33;--ink:#EAF0FF;--muted:#9AA7C4;--accent:#7C9BFF;--on-accent:#0E1424;--line:#27324D}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1.0625rem;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,"Segoe UI",sans-serif;line-height:1.1;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1000px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.logo{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.15rem;text-decoration:none;white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
nav::-webkit-scrollbar{display:none}
nav a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.95rem;white-space:nowrap}
nav a:hover{background:var(--surface);color:var(--ink)}
main{max-width:1000px;margin:auto;padding:0 20px}
.hero{display:grid;gap:40px;padding:48px 0 64px;align-items:center}
.photo{position:relative;width:min(260px,70%);justify-self:center}
.photo::before{content:"";position:absolute;inset:14px -14px -14px 14px;background:var(--warm);border-radius:28px}
